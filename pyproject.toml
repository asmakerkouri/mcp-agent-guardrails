[project]
name = "mcp-agent-guardrails"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mcpguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
